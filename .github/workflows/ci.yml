name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app
      
    - name: Build
      run: |
        xcodebuild -project HabitTracker.xcodeproj \
          -scheme HabitTracker \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          clean build




